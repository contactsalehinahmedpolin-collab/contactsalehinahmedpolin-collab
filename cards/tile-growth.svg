    <circle class="rg" style="animation-delay:1.60s" cx="250.33333333333331" cy="185" r="50" fill="none" stroke="#58a6ff" stroke-opacity=".3" stroke-width="2"/>
  </g>
  
  <!-- Category Tag -->
  <text class="r" style="animation-delay:1.35s" x="22" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#58a6ff">GROWTH ENGINE</text>
  <text class="n" style="animation-delay:2.40s" x="257.3333333333333" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#58a6ff">→</text>

