  <text class="r" style="animation-delay:1.95s" x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Shared brain and Team OS for</text><text class="r" style="animation-delay:2.03s" x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">autonomous AI agents, lead lists</text><text class="r" style="animation-delay:2.11s" x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">and CRM pipelines.</text>
  <line x1="20" y1="144" x2="265.3333333333333" y2="144" stroke="#30363d" stroke-width="1"/>
  <circle cx="26" cy="162" r="3.5" fill="#58a6ff"/>
