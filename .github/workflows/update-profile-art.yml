name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape live contributions
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}

      - name: Render animated profile cards
        run: python scripts/render_cards.py

      - name: Commit and push updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): refresh animated cards and heatmap [skip ci]"
          file_pattern: "data/contributions.json cards/**"
